name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at midnight (UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually test it from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send a light query to Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/shift_configs?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"